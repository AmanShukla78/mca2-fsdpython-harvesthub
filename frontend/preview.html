<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HarvestHub (P08) - Interactive Farm Management Platform</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌾</text></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- React 18 & Babel Standalone for Instant Local Execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --primary-green: #2e7d32;
      --bg-light: #f8fafc;
      --border-color: #e2e8f0;
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-light);
      color: #1e293b;
    }
    .brand-nav {
      background: linear-gradient(135deg, #1b5e20 0%, #2e7d32 100%);
      box-shadow: 0 4px 12px rgba(27, 94, 32, 0.15);
    }
    .nav-link.active-tab {
      background-color: rgba(255, 255, 255, 0.22) !important;
      border-radius: 6px;
      font-weight: 600;
      color: #fff !important;
    }
    .kpi-card {
      border: 1px solid var(--border-color);
      border-radius: 12px;
      background: #ffffff;
      transition: transform 0.2s;
    }
    .kpi-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    }
    .metric-value { font-size: 1.85rem; font-weight: 700; color: #0f172a; }
    .metric-label { font-size: 0.825rem; font-weight: 600; text-transform: uppercase; color: #64748b; }
    .badge-status { padding: 0.35em 0.65em; font-weight: 600; border-radius: 6px; font-size: 0.775rem; }
    .badge-active { background-color: #dcfce7; color: #166534; }
    .badge-in-progress { background-color: #e0f2fe; color: #0369a1; }
    .badge-planned { background-color: #fef3c7; color: #92400e; }
    .badge-completed { background-color: #d1fae5; color: #065f46; }
    .badge-maintenance { background-color: #fee2e2; color: #991b1b; }
    .badge-idle { background-color: #f1f5f9; color: #475569; }
    .field-card { border-left: 5px solid #2e7d32; border-radius: 10px; background: #fff; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">

    const initialMockState = {

      farms: [

        { field_id: 2, farm_name: "Sahyadri Agro Estate", field_name: "South Block B - Onion Terraces", area_acres: 30.50, soil_type: "Black Cotton", irrigation_source: "Canal", status: "Planted", active_crop: "Soybean (JS 335)" },

        { planting_id: 3, crop_name: "Sharbati Wheat", field_name: "Bathinda Track 1", season: "Rabi 2024-25", sowing_date: "2024-11-15", expected_harvest_date: "2025-03-30", target_yield_kg: 84000, current_stage: "Maturity", status: "In Progress", total_costs: 215000 },

      ],
      operations: [
        { operation_id: 1, operation_type: "Fertilizer Application", crop_name: "Onion (Bhima Super)", field_name: "North Plot A", scheduled_date: "2024-12-15", status: "Scheduled", assigned_to: "Raju Yadav", equipment: "ASPEE Boom Sprayer" },
        { operation_id: 2, operation_type: "Irrigation", crop_name: "Sharbati Wheat", field_name: "Bathinda Track 1", scheduled_date: "2024-12-18", status: "Completed", assigned_to: "Balwinder Singh", equipment: "Canal Sluice" },
        { operation_id: 3, operation_type: "Weeding", crop_name: "Sugarcane", field_name: "Manjri Block 1", scheduled_date: "2024-12-22", status: "Scheduled", assigned_to: "Vikram Choudhary", equipment: "Shaktiman Rotavator" }
      ],
      costs: [
        { cost_id: 1, crop_name: "Onion", input_type: "Seed", item_name: "Certified Onion Seeds (10kg)", quantity: "15 Kg", total_cost_inr: 33000, expense_date: "2024-11-05", supplier: "Kisan Agro Seed Corp" },
        { cost_id: 2, crop_name: "Onion", input_type: "Fertilizer", item_name: "IFFCO 10:26:26 Complex", quantity: "25 Bags", total_cost_inr: 36750, expense_date: "2024-11-12", supplier: "IFFCO Seva Kendra" },
        { cost_id: 3, crop_name: "Wheat", input_type: "Fuel", item_name: "High Speed Diesel", quantity: "350 L", total_cost_inr: 32375, expense_date: "2024-11-20", supplier: "Mahindra Spares Depot" },
        { cost_id: 4, crop_name: "Sugarcane", input_type: "Labor", item_name: "Sett Planting Labor Crew", quantity: "30 Man-days", total_cost_inr: 13500, expense_date: "2024-03-12", supplier: "Local Labor Union" }
      ],
      yields: [
        { yield_id: 1, crop_name: "Soybean (JS 335)", field_name: "South Block B", harvest_date: "2024-10-25", net_yield_kg: 33500, quality_grade: "Grade A", market_price_per_kg_inr: 46.50, total_revenue_inr: 1557750, buyer: "Godrej Agrovet" },
        { yield_id: 2, crop_name: "Basmati Rice 1121", field_name: "Bathinda Track 2", harvest_date: "2024-10-18", net_yield_kg: 89000, quality_grade: "Grade A", market_price_per_kg_inr: 42.00, total_revenue_inr: 3738000, buyer: "PUNGRAIN Mandi" },
        { yield_id: 3, crop_name: "Bt Cotton", field_name: "Krishna Cotton", harvest_date: "2024-11-05", net_yield_kg: 62000, quality_grade: "Grade B", market_price_per_kg_inr: 68.00, total_revenue_inr: 4216000, buyer: "NAFED Regional Hub" }
      ],
      equipment: [
        { equipment_id: 1, name: "Mahindra Arjun Novo 605 DI", category: "Tractor", serial_number: "M&M-NOV-2023-8891", meter_hours: 780.5, status: "Active" },

      ],
      maintenance: [
        { maintenance_id: 1, equipment: "Preet 987 Harvester", type: "Preventive Service", title: "Post-Paddy Full Service & Cutter Bar Alignment", date: "2024-10-25", cost: 18500, tech: "Paramjit Motor Works", status: "In Progress" },
        { maintenance_id: 2, equipment: "Mahindra Arjun Novo", type: "Preventive Service", title: "750-Hour Lube & Hydraulic Filter Change", date: "2024-08-15", cost: 6850, tech: "Dilip Sharma (M&M)", status: "Completed" },

      ],
      spares: [
        { part_id: 1, part_number: "FLT-OIL-MM605", name: "Mahindra Oil Filter Cartridge", stock: 18, reorder: 5, price: 580, is_low: false },
        { part_id: 4, part_number: "BLD-ROT-SHK7", name: "Shaktiman Rotavator Blades (Set of 6)", stock: 24, reorder: 8, price: 1450, is_low: false },
        { part_id: 10, part_number: "FLT-AIR-KUBOTA", name: "Kubota Dual Air Cleaner Element", stock: 2, reorder: 3, price: 2800, is_low: true },
        { part_id: 15, part_number: "CHN-ELEV-KUBOTA", name: "Kubota Elevator Drive Chain Link ASM", stock: 0, reorder: 2, price: 4200, is_low: true }
      ]
    };

    function App() {
      const [tab, setTab] = useState('dashboard');
      const [role, setRole] = useState('FARM_MANAGER');
      const [data, setData] = useState(initialMockState);
      const [isLiveConnected, setIsLiveConnected] = useState(false);

      useEffect(() => {
        // Probe live backend API at http://127.0.0.1:8000/api/
        fetch('http://127.0.0.1:8000/api/dashboard-summary/')
          .then(res => res.json())
          .then(summary => {
            if (summary && summary.kpis) {
              setIsLiveConnected(true);
              setData(prev => ({ ...prev, kpis: summary.kpis }));
            }
          })
          .catch(() => {
            console.log("Local standalone preview active with complete embedded sample dataset.");
          });
      }, []);

      const tabs = [
        { id: 'dashboard', label: 'Dashboard', icon: '📊' },
        { id: 'fields', label: '1. Field Mapping', icon: '🗺️' },
        { id: 'schedules', label: '2. Planting & Schedules', icon: '📅' },
        { id: 'costs', label: '3. Input & Costs', icon: '💰' },
        { id: 'yields', label: '4. Yield & Forecast', icon: '🌾' },
        { id: 'equipment', label: '5. Fleet Registry', icon: '🚜' },
        { id: 'maintenance', label: '6. Maintenance', icon: '🔧' },
        { id: 'utilization', label: '7. Fleet Utilization', icon: '⚡' },
        { id: 'spares', label: '8. Spare Parts', icon: '📦' }
      ];

      return (
        <div className="d-flex flex-column min-vh-100">

            <div className="container-fluid d-flex flex-wrap align-items-center justify-content-between">
              <div className="d-flex align-items-center gap-2">
                <span className="fs-3">🌾</span>
                <div>
                  <h1 className="h5 mb-0 fw-bold">HarvestHub</h1>
                  <small className="text-white-50" style={{ fontSize: '0.72rem' }}>Comprehensive Farm Management & Crop Planning Platform</small>
                </div>
              </div>
              <div className="d-flex align-items-center gap-3">
                <span className={`badge rounded-pill ${isLiveConnected ? 'bg-success' : 'bg-warning text-dark'}`}>
                  {isLiveConnected ? '● Live Django API Connected (Port 8000)' : '● Standalone Active Mode'}
                </span>
                <div className="d-flex align-items-center bg-black bg-opacity-25 px-2 py-1 rounded-pill small">
                  <span className="me-2 text-white-50">Role:</span>
                  <select
                    className="form-select form-select-sm bg-transparent text-white border-0 py-0 fw-semibold"
                    style={{ fontSize: '0.8rem', cursor: 'pointer' }}
                    value={role}
                    onChange={(e) => setRole(e.target.value)}
                  >
                    <option value="FARM_MANAGER" className="text-dark">Farm Manager</option>
                    <option value="FIELD_WORKER" className="text-dark">Field Worker</option>
                    <option value="ADMIN" className="text-dark">System Admin</option>
                  </select>
                </div>
                <span className="badge bg-light text-success fw-bold">P08 | Agriculture</span>
              </div>
            </div>
            <div className="container-fluid mt-2 pt-2 border-top border-white border-opacity-10 overflow-x-auto">
              <ul className="nav nav-pills flex-nowrap gap-1">
                {tabs.map((t) => (
                  <li key={t.id} className="nav-item">
                    <button
                      className={`nav-link text-white text-nowrap py-1 px-3 ${tab === t.id ? 'active-tab' : 'opacity-75'}`}
                      style={{ fontSize: '0.825rem' }}
                      onClick={() => setTab(t.id)}
                    >
                      {t.icon} {t.label}
                    </button>
                  </li>
                ))}
              </ul>
            </div>
          </header>

          <main className="container-fluid py-4 flex-grow-1">
            {tab === 'dashboard' && (
              <div>
                <div className="d-flex justify-content-between align-items-center mb-3">
                  <div>
                    <h4 className="fw-bold mb-1">Farm Operations Executive Dashboard</h4>
                    <p className="text-muted small mb-0">Multi-parcel land holdings, active crop rotation cycles, and fleet telematics.</p>
                  </div>
                  <div className="d-flex gap-2">
                    <button className="btn btn-outline-success btn-sm" onClick={() => setTab('schedules')}>+ Schedule Task</button>
                    <button className="btn btn-success btn-sm" onClick={() => setTab('costs')}>+ Record Cost</button>
                  </div>
                </div>

                <div className="row g-3 mb-4">
                  <div className="col-12 col-sm-6 col-xl-3">
                    <div className="kpi-card p-3">
                      <div className="metric-label">Total Land Holding</div>
                      <div className="metric-value text-success">{data.kpis.total_acres} <span className="fs-6 text-muted">Acres</span></div>
                      <small className="text-muted">{data.kpis.total_fields} Parcels across {data.kpis.total_farms} Estates</small>
                    </div>
                  </div>
                  <div className="col-12 col-sm-6 col-xl-3">
                    <div className="kpi-card p-3">
                      <div className="metric-label">Active Plantings</div>
                      <div className="metric-value text-primary">{data.kpis.active_plantings} <span className="fs-6 text-muted">Cycles</span></div>
                      <small className="text-muted">{data.kpis.planted_fields} Fields planted</small>
                    </div>
                  </div>
                  <div className="col-12 col-sm-6 col-xl-3">
                    <div className="kpi-card p-3">
                      <div className="metric-label">Fleet Status</div>
                      <div className="metric-value text-dark">{data.kpis.active_equipment} / {data.kpis.total_equipment} <span className="fs-6 text-muted">Active</span></div>
                      <small className="text-muted">{data.kpis.maintenance_equipment} in workshop | {data.kpis.idle_equipment} idle</small>
                    </div>
                  </div>
                  <div className="col-12 col-sm-6 col-xl-3">
                    <div className="kpi-card p-3">
                      <div className="metric-label">Net Agricultural Profit</div>
                      <div className="metric-value text-success">₹{(data.kpis.net_profit_inr / 100000).toFixed(2)} Lakh</div>
                      <small className="text-muted">₹{(data.kpis.total_revenue_inr / 100000).toFixed(1)}L Rev vs ₹{(data.kpis.total_expenses_inr / 100000).toFixed(1)}L Cost</small>
                    </div>
                  </div>
                </div>

                <div className="row g-3">
                  <div className="col-12 col-lg-5">
                    <div className="card border-0 shadow-sm p-3 mb-3">
                      <h6 className="fw-bold mb-2">⚠️ Critical Operational Alerts</h6>
                      <div className="p-2 mb-2 bg-light border-start border-4 border-warning small rounded">
                        <strong>Low Spares:</strong> Kubota air cleaners & elevator chain links below reorder level.
                      </div>
                      <div className="p-2 mb-2 bg-light border-start border-4 border-danger small rounded">
                        <strong>Overhaul Due:</strong> Preet 987 Harvester scheduled for 500-hour service.
                      </div>
                      <div className="p-2 bg-light border-start border-4 border-success small rounded">
                        <strong>Irrigation Ready:</strong> Canal water release active for Bathinda and Tenali tracks.
                      </div>
                    </div>
                  </div>
                  <div className="col-12 col-lg-7">
                    <div className="card border-0 shadow-sm p-3">
                      <h6 className="fw-bold mb-3">🗓️ Recent Field Operations</h6>
                      <div className="table-responsive">
                        <table className="table table-hover small mb-0">
                          <thead>
                            <tr><th>Operation</th><th>Crop & Parcel</th><th>Date</th><th>Assigned</th><th>Status</th></tr>
                          </thead>
                          <tbody>
                            {data.operations.map((op) => (
                              <tr key={op.operation_id}>
                                <td><strong>{op.operation_type}</strong></td>
                                <td>{op.crop_name} ({op.field_name})</td>
                                <td>{op.scheduled_date}</td>
                                <td>👤 {op.assigned_to}</td>
                                <td><span className="badge-status badge-completed">{op.status}</span></td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {tab === 'fields' && (
              <div>
                <h4 className="fw-bold mb-3">Module 1: Field & Crop Mapping</h4>
                <div className="row g-3">
                  {data.fields.map((f) => (
                    <div key={f.field_id} className="col-12 col-md-6 col-xl-3">
                      <div className="card p-3 field-card shadow-sm h-100">
                        <div className="d-flex justify-content-between mb-1">
                          <h6 className="fw-bold mb-0">{f.field_name}</h6>
                          <span className="badge-status badge-active">{f.status}</span>
                        </div>
                        <small className="text-muted">📍 {f.farm_name}</small>
                        <div className="my-2 small">
                          <div><strong>Acreage:</strong> {f.area_acres} Acres</div>
                          <div><strong>Soil:</strong> <span className="badge bg-secondary-subtle text-secondary">{f.soil_type}</span></div>
                          <div><strong>Irrigation:</strong> {f.irrigation_source}</div>
                        </div>
                        <div className="border-top pt-2 small">
                          <span className="text-muted">Mapped Crop: </span>
                          <strong className="text-success">{f.active_crop || 'Fallow / Prep'}</strong>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {tab === 'schedules' && (
              <div>
                <h4 className="fw-bold mb-3">Module 2: Planting & Harvesting Schedules</h4>
                <div className="d-flex flex-column gap-3">
                  {data.plantings.map((p) => (
                    <div key={p.planting_id} className="card p-3 shadow-sm border-0">
                      <div className="d-flex justify-content-between">
                        <h6 className="fw-bold text-dark">{p.crop_name} ({p.season})</h6>
                        <span className="badge-status badge-active">{p.status}</span>
                      </div>
                      <small className="text-muted">Parcel: {p.field_name}</small>
                      <div className="row mt-2 small text-muted">
                        <div className="col-3">Sowing: <strong className="text-dark d-block">{p.sowing_date}</strong></div>
                        <div className="col-3">Harvest Due: <strong className="text-dark d-block">{p.expected_harvest_date}</strong></div>
                        <div className="col-3">Target Yield: <strong className="text-success d-block">{p.target_yield_kg.toLocaleString()} kg</strong></div>
                        <div className="col-3">Current Stage: <strong className="text-primary d-block">{p.current_stage}</strong></div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {tab === 'costs' && (
              <div>
                <h4 className="fw-bold mb-3">Module 3: Input & Cost Tracking</h4>
                <div className="card shadow-sm border-0 p-3">
                  <table className="table table-hover small">
                    <thead><tr><th>Date</th><th>Category</th><th>Item</th><th>Quantity</th><th>Total (₹)</th><th>Vendor</th></tr></thead>
                    <tbody>
                      {data.costs.map((c) => (
                        <tr key={c.cost_id}>
                          <td>{c.expense_date}</td>
                          <td><span className="badge bg-primary-subtle text-primary">{c.input_type}</span></td>
                          <td><strong>{c.item_name}</strong></td>
                          <td>{c.quantity}</td>
                          <td className="fw-bold">₹{c.total_cost_inr.toLocaleString()}</td>
                          <td>{c.supplier}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {tab === 'yields' && (
              <div>
                <h4 className="fw-bold mb-3">Module 4: Yield Analysis & Mandi Revenue</h4>
                <div className="card shadow-sm border-0 p-3">
                  <table className="table table-hover small">
                    <thead><tr><th>Harvest Date</th><th>Crop</th><th>Net Yield</th><th>Quality</th><th>Rate (₹/kg)</th><th>Gross Revenue (₹)</th><th>Buyer</th></tr></thead>
                    <tbody>
                      {data.yields.map((y) => (
                        <tr key={y.yield_id}>
                          <td>{y.harvest_date}</td>
                          <td><strong>{y.crop_name}</strong></td>
                          <td className="text-success fw-bold">{y.net_yield_kg.toLocaleString()} kg</td>
                          <td><span className="badge bg-success-subtle text-success">{y.quality_grade}</span></td>
                          <td>₹{y.market_price_per_kg_inr.toFixed(2)}</td>
                          <td className="fw-bold">₹{y.total_revenue_inr.toLocaleString()}</td>
                          <td>{y.buyer}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {tab === 'equipment' && (
              <div>
                <h4 className="fw-bold mb-3">Module 5: Fleet Registry</h4>
                <div className="row g-3">
                  {data.equipment.map((eq) => (
                    <div key={eq.equipment_id} className="col-12 col-md-6 col-xl-3">
                      <div className="card p-3 shadow-sm border-0 h-100">
                        <span className="badge bg-secondary-subtle text-secondary mb-1" style={{ width: 'fit-content' }}>{eq.category}</span>
                        <h6 className="fw-bold mb-1">{eq.name}</h6>
                        <code className="small text-muted">{eq.serial_number}</code>
                        <div className="my-2 small">Operating Hours: <strong className="text-primary">{eq.meter_hours} hrs</strong></div>
                        <span className={`badge-status ${eq.status === 'Active' ? 'badge-active' : 'badge-maintenance'}`}>{eq.status}</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {tab === 'maintenance' && (
              <div>
                <h4 className="fw-bold mb-3">Module 6: Maintenance Scheduling & Tracking</h4>
                <div className="card shadow-sm border-0 p-3">
                  <table className="table table-hover small">
                    <thead><tr><th>Date</th><th>Asset</th><th>Type</th><th>Job Title</th><th>Cost (₹)</th><th>Technician</th><th>Status</th></tr></thead>
                    <tbody>
                      {data.maintenance.map((m) => (
                        <tr key={m.maintenance_id}>
                          <td>{m.date}</td>
                          <td><strong>{m.equipment}</strong></td>
                          <td><span className="badge bg-info-subtle text-info-emphasis">{m.type}</span></td>
                          <td>{m.title}</td>
                          <td className="fw-bold">₹{m.cost.toLocaleString()}</td>
                          <td>👤 {m.tech}</td>
                          <td><span className={`badge-status ${m.status === 'Completed' ? 'badge-completed' : 'badge-maintenance'}`}>{m.status}</span></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {tab === 'utilization' && (
              <div>
                <h4 className="fw-bold mb-3">Module 7: Utilization Analysis & Optimization</h4>
                <div className="row g-3 mb-4">
                  <div className="col-md-3">
                    <div className="p-3 bg-white border rounded">
                      <div className="text-muted small">FLEET RUN HOURS</div>
                      <h4 className="fw-bold text-primary mb-0">{data.kpis.total_fleet_hours} hrs</h4>
                    </div>
                  </div>
                  <div className="col-md-3">
                    <div className="p-3 bg-white border rounded">
                      <div className="text-muted small">DIESEL CONSUMED</div>
                      <h4 className="fw-bold text-dark mb-0">{data.kpis.total_fuel_litres} Litres</h4>
                    </div>
                  </div>
                  <div className="col-md-3">
                    <div className="p-3 bg-white border rounded">
                      <div className="text-muted small">BURN RATE</div>
                      <h4 className="fw-bold text-success mb-0">5.96 L/hr</h4>
                    </div>
                  </div>
                  <div className="col-md-3">
                    <div className="p-3 bg-white border rounded">
                      <div className="text-muted small">UTILIZATION RATE</div>
                      <h4 className="fw-bold text-success mb-0">82.5% Active</h4>
                    </div>
                  </div>
                </div>
                <div className="card border-0 bg-success-subtle p-3 rounded">
                  <h6 className="fw-bold text-success-emphasis">💡 Agronomic Route Optimization Active:</h6>
                  <p className="small text-success-emphasis mb-0">Combine harvesting transit grouped by contiguous parcels, reducing deadhead tractor transit by 45 km and saving ~120L diesel per season.</p>
                </div>
              </div>
            )}

            {tab === 'spares' && (
              <div>
                <h4 className="fw-bold mb-3">Module 8: Spare Parts Inventory</h4>
                <div className="card shadow-sm border-0 p-3">
                  <table className="table table-hover small">
                    <thead><tr><th>Part Number</th><th>Name</th><th>Stock</th><th>Reorder Level</th><th>Unit Price (₹)</th><th>Status</th></tr></thead>
                    <tbody>
                      {data.spares.map((p) => (
                        <tr key={p.part_id}>
                          <td><code>{p.part_number}</code></td>
                          <td><strong>{p.name}</strong></td>
                          <td className={p.is_low ? 'text-danger fw-bold' : 'text-success fw-bold'}>{p.stock}</td>
                          <td>{p.reorder}</td>
                          <td>₹{p.price.toLocaleString()}</td>
                          <td>
                            {p.stock === 0 ? <span className="badge bg-danger">Out of Stock</span> :
                             p.is_low ? <span className="badge bg-warning text-dark">Low Stock</span> :
                             <span className="badge bg-success">Adequate</span>}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </main>

          <footer className="bg-white border-top py-3 text-center text-muted small">
            HarvestHub (P08) &bull; Comprehensive Farm Management & Crop Planning Platform
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
